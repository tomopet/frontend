<!DOCTYPE html>
<!-- ============================================================
     TOMOPET | index.html
     검색 키워드: 홈, 메인, 히어로, 통합 검색, 인기 밥상, 통계, 캐릭터 이미지 교체
     홈 / 진입점

     구조
       슬로건 -> 캐릭터 -> 통합 검색 -> 아이콘 바로가기 -> 인기 밥상 -> 사료 추천

     중앙 정렬 단일 컬럼입니다.
     시선이 검색 하나로 모이도록 그 위아래를 비웠습니다.

     홈 검색바는 제거했습니다. 재료 검색은 식단 페이지의
     음식 검색 모달에서 합니다 (바로가기 "식단분석"으로 진입).
     ============================================================ -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 데스크톱 전용 - 최소 지원 폭 1024px -->
  <meta name="viewport" content="width=1024">
  <meta name="description" content="먹여도 되는 재료인지 검색하고, 식단을 기록하고, 인기 밥상을 공유하세요">
  <title>TOMOPET - 우리 아이 밥상의 모든 것</title>

  <!-- [공통] 파비콘 -->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <!-- 링크 공유 시 미리보기 카드
       [확인 필요] 배포 주소 확정 후 아래 두 값을 실제 URL 로 교체할 것
         og:image 는 절대 경로여야 함. 상대 경로는 미리보기에 표시되지 않음 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="TOMOPET - 우리 아이 밥상의 모든 것">
  <meta property="og:description" content="먹여도 되는 재료인지 검색하고, 식단을 기록하고, 인기 밥상을 공유하세요">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://example.github.io/tomopet/">
  <meta property="og:image" content="https://example.github.io/tomopet/assets/hero-dog.svg">
  <!-- [공통] 전역 스타일 - 로드 순서 고정 -->
  <link rel="stylesheet" href="./styles/variables.css">
  <link rel="stylesheet" href="./styles/common.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/index.css">
</head>
<body>

  <!-- [공통] 본문 바로가기 - 키보드 접근성 -->
  <a href="#main-content" class="skip-link">본문 바로가기</a>

  <!-- [공통] 헤더 -->
  <div id="header-placeholder"></div>

  <main class="site-main site-main--flush" id="main-content">

    <!-- ========================================================
         히어로 - 슬로건 + 캐릭터 + 통합 검색

         중앙 단일 컬럼. 검색이 유일한 주요 액션이 되도록
         주변을 비우고 색을 절제함
         ======================================================== -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero__inner">

        <!-- 펫프렌즈식 기능 직결형 문구
             바로 아래 검색창 플레이스홀더가 "먹여도 될까요?" 질문을 하므로
             제목은 질문을 반복하지 않고 서비스가 하는 일을 나열함 -->
        <h1 class="hero__title" id="hero-title">재료 검색부터 식단 기록, 밥상 공유까지 한 번에</h1>

        <!-- 캐릭터 비주얼 (작은 원형, 160px)
             [확인 필요] 지금은 임시 일러스트입니다.
             교체 방법: 안에 아래 한 줄을 넣고 임시 span 은 지우세요.
               <img class="hero__visual-img" src="./assets/hero.png" alt="">
               - 정방형 320×320px 권장 (표시 160px 의 2배, 고해상도 대응)
               - 원형으로 잘리므로 캐릭터를 중앙에 배치할 것
               - 투명 배경 png/webp 면 흰 원 안에 캐릭터만 떠서 깔끔함 -->
        <div class="hero__visual">
          <span class="hero__visual-placeholder" aria-hidden="true">
            <img src="./assets/hero-dog.svg" alt="" width="112" height="112">
          </span>
        </div>

        <!-- ========================================================
             아이콘 바로가기 - 히어로의 주 동선

             홈 검색바는 제거함 (검색은 식단 페이지 모달로 일원화,
             헤더 검색 아이콘이 식단으로 연결됨)
             틴트 배경 위이므로 아이콘 칩은 흰색으로 반전 (index.css)
             ======================================================== -->
        <nav class="quick-nav" aria-labelledby="quick-nav-title">
          <h2 class="sr-only" id="quick-nav-title">주요 기능 바로가기</h2>

            <ul class="quick-nav__list">
              <li>
                <a class="quick-item" href="./diet.html">
                  <span class="quick-item__icon" aria-hidden="true">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
                      <path d="M4 13h16a8 8 0 0 1-16 0Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                      <path d="M6 13a6 6 0 0 1 12 0" stroke="currentColor" stroke-width="1.6"/>
                      <path d="M3 21h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                  </span>
                  <span class="quick-item__label">식단분석</span>
                </a>
              </li>
              <li>
                <a class="quick-item" href="./health-record.html">
                  <span class="quick-item__icon quick-item__icon--accent" aria-hidden="true">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
                      <path d="M4 19V5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                      <path d="M4 19h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                      <path d="M7 15l4-5 3 3 4-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                  <span class="quick-item__label">건강기록</span>
                </a>
              </li>
              <li>
                <a class="quick-item" href="./community.html">
                  <span class="quick-item__icon" aria-hidden="true">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
                      <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
                      <circle cx="8.5" cy="9.5" r="1.6" stroke="currentColor" stroke-width="1.6"/>
                      <path d="M4 16l4.5-4 4 3.5 3-2.5 4.5 4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg>
                  </span>
                  <span class="quick-item__label">밥상자랑</span>
                </a>
              </li>
              <li>
                <a class="quick-item" href="./ai-chat.html">
                  <span class="quick-item__icon quick-item__icon--accent" aria-hidden="true">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
                      <path d="M4 5.5h16v11H9l-5 4v-15Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                      <path d="M8.5 11h.01M12 11h.01M15.5 11h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                  </span>
                  <span class="quick-item__label">AI 비서</span>
                </a>
              </li>
              <li>
                <a class="quick-item" href="./my-page.html">
                  <span class="quick-item__icon" aria-hidden="true">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
                      <ellipse cx="12" cy="15.5" rx="4.5" ry="3.5" stroke="currentColor" stroke-width="1.6"/>
                      <ellipse cx="6" cy="9" rx="2" ry="2.5" stroke="currentColor" stroke-width="1.6"/>
                      <ellipse cx="18" cy="9" rx="2" ry="2.5" stroke="currentColor" stroke-width="1.6"/>
                      <ellipse cx="10" cy="6" rx="1.8" ry="2.2" stroke="currentColor" stroke-width="1.6"/>
                      <ellipse cx="14" cy="6" rx="1.8" ry="2.2" stroke="currentColor" stroke-width="1.6"/>
                    </svg>
                  </span>
                  <span class="quick-item__label">내 아이들</span>
                </a>
              </li>
          </ul>
        </nav>

      </div>
    </section>


    <!-- ========================================================
         인기 밥상
         ======================================================== -->
    <section class="home-section home-section--band" aria-labelledby="popular-posts-title">
      <div class="container">
        <div class="home-section__head">
          <h2 class="home-section__title" id="popular-posts-title">인기 밥상</h2>
          <a class="home-section__more" href="./community.html">
            전체보기
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>

        <!-- JS 가 채움 -->
        <!-- 로딩 중 스켈레톤 - renderList 가 실행되면 통째로 교체됨 -->
        <ul class="card-grid" id="popular-post-list">
          <li class="card" aria-hidden="true">
            <span class="skeleton skeleton--thumb"></span>
            <div class="card__body">
              <span class="skeleton skeleton--badge"></span>
              <span class="skeleton skeleton--line"></span>
              <span class="skeleton skeleton--line-short"></span>
            </div>
          </li>
          <li class="card" aria-hidden="true">
            <span class="skeleton skeleton--thumb"></span>
            <div class="card__body">
              <span class="skeleton skeleton--badge"></span>
              <span class="skeleton skeleton--line"></span>
              <span class="skeleton skeleton--line-short"></span>
            </div>
          </li>
          <li class="card" aria-hidden="true">
            <span class="skeleton skeleton--thumb"></span>
            <div class="card__body">
              <span class="skeleton skeleton--badge"></span>
              <span class="skeleton skeleton--line"></span>
              <span class="skeleton skeleton--line-short"></span>
            </div>
          </li>
        </ul>

        <div class="empty-state" id="popular-post-empty" hidden>
          <!-- 일러스트 자리
               교체 방법: 아래 svg 를 <img src="./assets/empty-bowl.png" alt="">
               같은 이미지 태그로 바꾸면 됩니다 (정방형 192px+ 권장) -->
          <span class="empty-state__figure" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M4 12h16"/>
              <path d="M5 12a7 7 0 0 0 14 0"/>
              <path d="M8.5 8.5C8.5 7 9.5 6 11 6M13.5 7.5c0-1 .8-1.8 1.8-1.8"/>
            </svg>
          </span>
          <p class="empty-state__title">첫 밥상을 기다리고 있어요</p>
          <p class="empty-state__desc">우리 아이 밥상을 가장 먼저 자랑해보세요</p>
          <a href="./post-write.html" class="btn btn--primary empty-state__action">글 쓰러 가기</a>
        </div>
      </div>
    </section>


    <!-- ========================================================
         서비스 통계 - 푸터 바로 위, 보조 정보

         "-" 는 하드코딩된 값이 아니라 로딩 중 표시임
         실제 값은 GET /api/stats 로 채워짐
         ======================================================== -->
    <section class="stats" aria-labelledby="stats-title">
      <div class="container">
        <h2 class="sr-only" id="stats-title">서비스 현황</h2>
        <ul class="stats__list">
          <li class="stats__item">
            <strong class="stats__value" id="stat-recipe-count"><span class="skeleton skeleton--stat" aria-hidden="true"></span></strong>
            <span class="stats__label">공유된 레시피</span>
          </li>
          <li class="stats__item">
            <strong class="stats__value" id="stat-member-count"><span class="skeleton skeleton--stat" aria-hidden="true"></span></strong>
            <span class="stats__label">함께하는 보호자</span>
          </li>
          <li class="stats__item">
            <strong class="stats__value" id="stat-pet-count"><span class="skeleton skeleton--stat" aria-hidden="true"></span></strong>
            <span class="stats__label">등록된 아이들</span>
          </li>
        </ul>
      </div>
    </section>

  </main>

  <!-- [공통] 푸터 -->
  <div id="footer-placeholder"></div>


  <!-- ============================================================
       [공통] 스크립트 - 로드 순서 고정
       ============================================================ -->
  <script src="./scripts/layout.js"></script>
  <script src="./scripts/api.js" defer></script>
  <script src="./scripts/ui.js" defer></script>
  <script src="./scripts/index.js" defer></script>

</body>
</html>
