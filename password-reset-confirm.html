<!DOCTYPE html>
<!-- ============================================================
     TOMOPET | password-reset-confirm.html
     비밀번호 재설정 2단계 - 새 비밀번호 설정
     ============================================================ -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 데스크톱 전용 - 최소 지원 폭 1024px -->
  <meta name="viewport" content="width=1024">
  <meta name="description" content="반려동물 밥 꾸미기 커뮤니티 TOMOPET">
  <title>비밀번호 재설정 | TOMOPET</title>

  <!-- [공통] 파비콘 - 없으면 favicon.ico 404 발생 -->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <!-- [공통] 테마 - 반드시 스타일보다 먼저, defer 없이 실행
       본문이 그려지기 전에 data-theme 을 정해야 화면이 번쩍이지 않음 -->
  <script src="./scripts/theme.js"></script>

  <!-- [공통] 전역 스타일 - 로드 순서 고정 -->
  <link rel="stylesheet" href="./styles/variables.css">
  <link rel="stylesheet" href="./styles/common.css">
  <link rel="stylesheet" href="./styles/components.css">
  <!-- 페이지 전용 스타일 -->
  <link rel="stylesheet" href="./styles/password-reset.css">
</head>
<body>

  <!-- [공통] 본문 바로가기 - 키보드 접근성 -->
  <a href="#main-content" class="skip-link">본문 바로가기</a>

  <!-- [공통] 헤더 - components/header.html 이 삽입되는 위치 -->
  <div id="header-placeholder"></div>

  <main class="site-main site-main--auth" id="main-content" role="main">
    <div class="reset-panel">

      <ol class="reset-steps" aria-label="비밀번호 재설정 단계">
        <li class="reset-steps__item reset-steps__item--done">
          <span class="reset-steps__num">1</span>
          <span class="reset-steps__label">이메일 인증</span>
        </li>
        <li class="reset-steps__item reset-steps__item--active" aria-current="step">
          <span class="reset-steps__num">2</span>
          <span class="reset-steps__label">비밀번호 재설정</span>
        </li>
      </ol>

      <!-- ============================================================
           새 비밀번호 설정 폼
           [API 연동] POST /api/auth/password/reset
           요청 본문 { token, password }

           token 은 URL 쿼리스트링에서 추출
           예: password-reset-confirm.html?token=abc123
           ============================================================ -->
      <div class="reset-panel__body" id="reset-form-view">

        <h1 class="reset-panel__title">새 비밀번호 설정</h1>
        <p class="reset-panel__desc">
          사용할 새 비밀번호를 입력해주세요
        </p>

        <form class="reset-form" id="reset-confirm-form" novalidate>

          <div class="form-field">
            <label class="form-field__label" for="new-password">새 비밀번호</label>
            <input type="password" class="form-field__input" id="new-password" name="password"
                   placeholder="8자 이상 입력" autocomplete="new-password" minlength="8" required>

            <!-- password-reset-confirm.js 가 입력에 따라
                 .is-valid 와 aria-checked 를 토글

                 [접근성] aria-checked 는 role 이 있어야 유효함 -->
            <ul class="password-rules" id="password-rules" aria-label="비밀번호 조건">
              <li class="password-rules__item" data-rule="length"
                  role="checkbox" aria-checked="false">8자 이상</li>
              <li class="password-rules__item" data-rule="letter"
                  role="checkbox" aria-checked="false">영문 포함</li>
              <li class="password-rules__item" data-rule="number"
                  role="checkbox" aria-checked="false">숫자 포함</li>
              <li class="password-rules__item" data-rule="special"
                  role="checkbox" aria-checked="false">특수문자 포함</li>
            </ul>

            <span class="form-field__error" id="new-password-error" role="alert" hidden></span>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="new-password-confirm">새 비밀번호 확인</label>
            <input type="password" class="form-field__input" id="new-password-confirm"
                   name="passwordConfirm" placeholder="비밀번호를 다시 입력하세요"
                   autocomplete="new-password" required>
            <span class="form-field__error" id="new-password-confirm-error" role="alert" hidden></span>
          </div>

          <button type="submit" class="btn btn--primary btn--full btn--lg" id="reset-confirm-btn">
            비밀번호 변경
          </button>

        </form>

      </div>

      <!-- ============================================================
           토큰 만료 또는 유효하지 않음
           password-reset-confirm.js 가 토큰 검증 실패 시 이 영역으로 전환
           ============================================================ -->
      <div class="reset-panel__body" id="reset-invalid-view" hidden>

        <div class="reset-sent__icon reset-sent__icon--danger" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5M12 17h.01"/>
          </svg>
        </div>

        <h2 class="reset-panel__title">링크가 만료되었습니다</h2>
        <p class="reset-panel__desc">
          비밀번호 재설정 링크는 30분간만 유효합니다<br>
          재설정을 다시 요청해주세요
        </p>

        <a href="./password-reset.html" class="btn btn--primary btn--full btn--lg">
          다시 요청하기
        </a>

        <div class="reset-panel__footer">
          <a href="./login.html" class="reset-panel__link">로그인으로 돌아가기</a>
        </div>

      </div>

      <!-- ============================================================
           변경 완료
           password-reset-confirm.js 가 변경 성공 시 이 영역으로 전환
           ============================================================ -->
      <div class="reset-panel__body" id="reset-done-view" hidden>

        <div class="reset-sent__icon reset-sent__icon--success" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
          </svg>
        </div>

        <h2 class="reset-panel__title">비밀번호가 변경되었습니다</h2>
        <p class="reset-panel__desc">
          새 비밀번호로 로그인해주세요
        </p>

        <a href="./login.html" class="btn btn--primary btn--full btn--lg">
          로그인하러 가기
        </a>

      </div>

    </div>
  </main>

  <!-- [공통] 푸터 - components/footer.html 이 삽입되는 위치 -->
  <div id="footer-placeholder"></div>


  <!-- ============================================================
       [공통] 스크립트 - 로드 순서 고정

       layout.js  defer 없이 즉시 실행. window.TomopetAuth 정의
       api.js     defer. window.TomopetApi 정의 (TomopetAuth 의존)
       ui.js      defer. window.TomopetUi 정의
       [페이지].js defer. 위 세 모듈을 사용

       defer 스크립트는 문서 순서대로 실행되므로
       페이지 스크립트가 실행될 때 세 모듈이 모두 준비되어 있음
       ============================================================ -->
  <script src="./scripts/layout.js"></script>
  <script src="./scripts/api.js" defer></script>
  <script src="./scripts/ui.js" defer></script>

  <!-- 페이지 전용 스크립트 -->
  <script src="./scripts/password-reset-confirm.js" defer></script>

</body>
</html>
