<!DOCTYPE html>
<!-- ============================================================
     TOMOPET | password-reset.html
     비밀번호 재설정 1단계 - 이메일 인증 요청
     ============================================================ -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 데스크톱 전용 - 최소 지원 폭 1024px -->
  <meta name="viewport" content="width=1024">
  <meta name="description" content="반려동물 밥 꾸미기 커뮤니티 TOMOPET">
  <title>비밀번호 찾기 | TOMOPET</title>

  <!-- [공통] 파비콘 - 없으면 favicon.ico 404 발생 -->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <!-- [공통] 테마 - 반드시 스타일보다 먼저, defer 없이 실행
       본문이 그려지기 전에 data-theme 을 정해야 화면이 번쩍이지 않음 -->
  <script src="./scripts/theme.js"></script>

  <!-- [공통] 전역 스타일 - 로드 순서 고정 -->
  <link rel="stylesheet" href="./styles/variables.css">
  <link rel="stylesheet" href="./styles/common.css">
  <link rel="stylesheet" href="./styles/components.css">
  <!-- 페이지 전용 스타일 -->
  <link rel="stylesheet" href="./styles/password-reset.css">
</head>
<body>

  <!-- [공통] 본문 바로가기 - 키보드 접근성 -->
  <a href="#main-content" class="skip-link">본문 바로가기</a>

  <!-- [공통] 헤더 - components/header.html 이 삽입되는 위치 -->
  <div id="header-placeholder"></div>

  <main class="site-main site-main--auth" id="main-content" role="main">
    <div class="reset-panel">

      <!-- ============================================================
           단계 표시
           1단계 이메일 인증 -> 2단계 비밀번호 재설정
           ============================================================ -->
      <ol class="reset-steps" aria-label="비밀번호 재설정 단계">
        <li class="reset-steps__item reset-steps__item--active" aria-current="step">
          <span class="reset-steps__num">1</span>
          <span class="reset-steps__label">이메일 인증</span>
        </li>
        <li class="reset-steps__item">
          <span class="reset-steps__num">2</span>
          <span class="reset-steps__label">비밀번호 재설정</span>
        </li>
      </ol>

      <!-- ============================================================
           요청 폼
           [API 연동] POST /api/auth/password/reset-request
           요청 본문 { email }
           보안상 가입 여부와 무관하게 항상 성공 응답 처리 권장
           ============================================================ -->
      <div class="reset-panel__body" id="reset-request-view">

        <h1 class="reset-panel__title">비밀번호 찾기</h1>
        <p class="reset-panel__desc">
          가입하신 이메일 주소를 입력하시면<br>
          비밀번호 재설정 링크를 보내드립니다
        </p>

        <form class="reset-form" id="reset-request-form" novalidate>

          <div class="form-field">
            <label class="form-field__label" for="reset-email">이메일</label>
            <input type="email" class="form-field__input" id="reset-email" name="email"
                   placeholder="name@example.com" autocomplete="email" required>
            <span class="form-field__error" id="reset-email-error" role="alert" hidden></span>
          </div>

          <button type="submit" class="btn btn--primary btn--full btn--lg" id="reset-request-btn">
            재설정 링크 받기
          </button>

        </form>

        <div class="reset-panel__footer">
          <a href="./login.html" class="reset-panel__link">로그인으로 돌아가기</a>
        </div>

      </div>

      <!-- ============================================================
           발송 완료 안내
           password-reset.js 가 요청 성공 시 이 영역으로 전환
           ============================================================ -->
      <div class="reset-panel__body" id="reset-sent-view" hidden>

        <div class="reset-sent__icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
          </svg>
        </div>

        <h2 class="reset-panel__title">메일을 확인해주세요</h2>
        <p class="reset-panel__desc">
          <!-- 이메일 주소는 사용자 입력이므로 textContent 로 삽입 -->
          <strong id="reset-sent-email">-</strong> 으로<br>
          비밀번호 재설정 링크를 보냈습니다
        </p>

        <div class="banner banner--info">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
          </svg>
          <span>링크는 발송 후 30분간 유효합니다</span>
        </div>

        <!-- 재발송은 60초 쿨다운 (버튼 비활성화 + 카운트다운) -->
        <button type="button" class="btn btn--secondary btn--full" id="reset-resend-btn">
          메일 재발송
        </button>

        <div class="reset-panel__footer">
          <a href="./login.html" class="reset-panel__link">로그인으로 돌아가기</a>
        </div>

      </div>

    </div>
  </main>

  <!-- [공통] 푸터 - components/footer.html 이 삽입되는 위치 -->
  <div id="footer-placeholder"></div>


  <!-- ============================================================
       [공통] 스크립트 - 로드 순서 고정

       layout.js  defer 없이 즉시 실행. window.TomopetAuth 정의
       api.js     defer. window.TomopetApi 정의 (TomopetAuth 의존)
       ui.js      defer. window.TomopetUi 정의
       [페이지].js defer. 위 세 모듈을 사용

       defer 스크립트는 문서 순서대로 실행되므로
       페이지 스크립트가 실행될 때 세 모듈이 모두 준비되어 있음
       ============================================================ -->
  <script src="./scripts/layout.js"></script>
  <script src="./scripts/api.js" defer></script>
  <script src="./scripts/ui.js" defer></script>

  <!-- 페이지 전용 스크립트 -->
  <script src="./scripts/password-reset.js" defer></script>

</body>
</html>
