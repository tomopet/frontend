<?xml version="1.0" encoding="UTF-8"?>
<!-- ============================================================
     TOMOPET | assets/hero-bowl.svg
     홈 히어로 대표 이미지 (임시 일러스트)

     실제 사진으로 교체하는 것을 권장함
     .thumb 이 4:5 비율이므로 세로 사진이 적합
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="반려동물 밥그릇 일러스트">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#FBEDE6"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0A182"/>
      <stop offset="100%" stop-color="#D9714B"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- 배경 잎사귀 - 세이지 -->
  <g opacity="0.35" fill="#567F63">
    <ellipse cx="66" cy="112" rx="30" ry="15" transform="rotate(-28 66 112)"/>
    <ellipse cx="338" cy="90" rx="26" ry="13" transform="rotate(20 338 90)"/>
    <ellipse cx="352" cy="404" rx="32" ry="16" transform="rotate(-14 352 404)"/>
    <ellipse cx="52" cy="382" rx="24" ry="12" transform="rotate(34 52 382)"/>
  </g>

  <!-- 매트 -->
  <ellipse cx="200" cy="358" rx="146" ry="40" fill="#E8F0EA"/>

  <!-- 밥그릇 -->
  <path d="M92 300 Q200 262 308 300 L288 372 Q200 404 112 372 Z" fill="url(#bowl)"/>
  <ellipse cx="200" cy="300" rx="108" ry="34" fill="#F6C0A8"/>
  <ellipse cx="200" cy="300" rx="92" ry="27" fill="#FBEDE6"/>

  <!-- 사료/음식 -->
  <g fill="#8A5A3C">
    <circle cx="170" cy="296" r="12"/>
    <circle cx="204" cy="288" r="14"/>
    <circle cx="236" cy="298" r="11"/>
    <circle cx="186" cy="308" r="10"/>
    <circle cx="220" cy="308" r="12"/>
  </g>
  <!-- 브로콜리 - 세이지 포인트 -->
  <g fill="#567F63">
    <circle cx="248" cy="284" r="9"/>
    <circle cx="256" cy="292" r="7"/>
    <circle cx="240" cy="292" r="6"/>
    <rect x="245" y="294" width="5" height="10" rx="2"/>
  </g>
  <!-- 당근 -->
  <path d="M152 284 l16 6 -14 8 z" fill="#E8845F"/>

  <!-- 그릇 하이라이트 -->
  <path d="M118 318 Q136 348 154 366" stroke="#FBEDE6" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- 발자국 -->
  <g fill="#2E2019" opacity="0.16">
    <ellipse cx="112" cy="446" rx="14" ry="11"/>
    <circle cx="97" cy="430" r="5"/>
    <circle cx="108" cy="424" r="5"/>
    <circle cx="120" cy="425" r="5"/>
    <circle cx="130" cy="433" r="5"/>

    <ellipse cx="288" cy="446" rx="14" ry="11"/>
    <circle cx="273" cy="430" r="5"/>
    <circle cx="284" cy="424" r="5"/>
    <circle cx="296" cy="425" r="5"/>
    <circle cx="306" cy="433" r="5"/>
  </g>
</svg>
