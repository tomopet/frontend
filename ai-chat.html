<!DOCTYPE html>
<!-- ============================================================
     TOMOPET | ai-chat.html
     검색 키워드: AI 상담, 채팅
     AI 식재료 안전성 상담 채팅 페이지 (협업자 담당)

     담당: 협업자
     의존 스크립트
       layout.js   즉시 실행 — window.TomopetAuth 정의
       api.js      defer — window.TomopetApi 정의
       ui.js       defer — window.TomopetUi 정의
       ai-chat.js  defer — 페이지 전용

     연동 엔드포인트
       GET  /api/chats                      대화 목록
       POST /api/chats                      새 대화 생성
       GET  /api/chats/:chatId/messages     메시지 목록
       POST /api/chats/:chatId/messages     메시지 전송

     [주의] 백엔드 AI 가 준비돼야 실제 응답 테스트 가능
            백엔드 일정 확인 후 마지막에 착수할 것
            AI 응답 문자열은 textContent 로만 삽입 (innerHTML 금지)
            AI 응답에 면책 문구 필수:
            "AI 분석 결과는 참고 정보이며 수의학적 진단이 아닙니다."

     [수정 이력]
       - login.html / password-reset.html 공통 구조 적용
         (skip-link, header/footer placeholder, 스크립트 로드 순서)
       - data-backend-ready 속성으로 프로토타입 모드 제어
       - 인증 가드 프로토타입 바이패스 조건 추가
         (Api 모듈 없는 환경에서 login.html 리다이렉트 방지)
     ============================================================ -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 데스크톱 전용 - 최소 지원 폭 1024px -->
  <meta name="viewport" content="width=1024">
  <meta name="description" content="반려동물 식재료 안전성 AI 상담 TOMOPET">
  <title>AI 비서 | TOMOPET</title>

  <!-- [공통] 파비콘 - 없으면 favicon.ico 404 발생 -->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <!-- [공통] 전역 스타일 - 로드 순서 고정
       variables.css 가 먼저 와야 var(--color-primary) 등이 해석됨 -->
  <link rel="stylesheet" href="./styles/variables.css">
  <link rel="stylesheet" href="./styles/common.css">
  <link rel="stylesheet" href="./styles/components.css">
  <!-- 페이지 전용 스타일 -->
  <link rel="stylesheet" href="./styles/ai-chat.css">
</head>
<!--
  data-backend-ready="false" — 프로토타입 모드
  백엔드 AI 연동 완료 시 "true" 로 변경
  ai-chat.js 가 이 값을 읽어 API 호출 여부를 결정
-->
<body data-backend-ready="false">

  <!-- [공통] 본문 바로가기 - 키보드 접근성 (Tab 첫 포커스) -->
  <a href="#main-content" class="skip-link">본문 바로가기</a>

  <!-- [공통] 헤더 - layout.js 가 components/header.html 을 삽입 -->
  <div id="header-placeholder"></div>

  <!-- 메인 컨텐츠 영역 -->
  <main class="site-main" id="main-content" role="main">

    <!-- [공통] 다른 페이지와 좌우 여백을 맞추기 위한 컨테이너
         .container 가 max-width 1200px + 좌우 패딩을 담당함 -->
    <div class="container">

      <!-- 페이지 헤더 -->
      <header class="page-head">
        <div>
          <p class="page-head__eyebrow">AI ASSISTANT</p>
          <h1>이거 먹여도 될까요?</h1>
          <p class="page-head__desc">식재료 사진과 이름, 급여량을 알려주시면 안전 여부를 확인해드립니다.</p>
        </div>
        <!-- [추후 적용] 백엔드 연동 완료 후 배지 상태 변경 -->
        <span class="backend-badge" id="backend-status-badge">백엔드 연동 대기</span>
      </header>

      <!-- ============================================================
           채팅 워크스페이스
           ─ 좌측: 대화 목록 패널 (conversation-panel)
           ─ 우측: 채팅 패널 (chat-panel)
             ─ 상단: 채팅 헤더
             ─ 중단: 메시지 로그 (chat-log)
             ─ 하단: 메시지 입력 폼 (composer)
           ============================================================ -->
      <section class="chat-workspace" aria-label="AI 상담 화면">

        <!-- 대화 목록 패널
             [API 연동] GET /api/chats 응답으로 목록을 채움
             ai-chat.js 의 renderConversations() 가 렌더링 담당 -->
        <aside class="panel conversation-panel" aria-labelledby="conversation-title">
          <div class="conversation-head">
            <h2 id="conversation-title">대화 목록</h2>
            <!-- [API 연동] POST /api/chats — 새 대화 생성 -->
            <button class="icon-button" id="new-chat-button" type="button"
                    aria-label="새 대화 시작">＋</button>
          </div>
          <!-- ai-chat.js 의 renderConversations() 가 버튼을 동적으로 삽입 -->
          <div class="conversation-list" id="conversation-list" role="list"></div>
        </aside>

        <!-- 채팅 패널 -->
        <article class="panel chat-panel" aria-labelledby="chat-title">

          <!-- 채팅 헤더 -->
          <header class="chat-head">
            <div class="chat-head__profile">
              <div class="chat-head__avatar" aria-hidden="true">AI</div>
              <div>
                <h2 id="chat-title">이거 먹여도 될까요?</h2>
                <p>식재료 사진과 질문을 함께 보내세요.</p>
              </div>
            </div>
            <!-- 현재 대화 초기화 버튼 -->
            <button class="icon-button" id="clear-chat-button" type="button"
                    aria-label="현재 대화 내용 모두 지우기">↺</button>
          </header>

          <!-- 메시지 로그
               [접근성] role="log" + aria-live="polite" 로 스크린리더에 새 메시지 알림
               ai-chat.js 의 appendMessage() 가 article 요소를 동적으로 추가 -->
          <div class="chat-log" id="chat-log"
               role="log" aria-live="polite" aria-relevant="additions"></div>

          <!-- ============================================================
               메시지 입력 폼 (composer)
               [API 연동] POST /api/chats/:chatId/messages
               폼은 submit 이벤트 바인딩 — 버튼 click 에 걸면 Enter 키 제출 시 오작동
               ============================================================ -->
          <form class="composer" id="message-form" novalidate>

            <!-- 첨부 파일 상태 표시줄 -->
            <div class="composer__attachment">
              <span id="attachment-name">첨부된 사진 없음</span>
              <!-- 첨부 삭제 — 기본 hidden, 파일 선택 시 노출 -->
              <button class="icon-button" id="remove-attachment" type="button"
                      hidden aria-label="첨부 파일 삭제">×</button>
            </div>

            <div class="composer__row">
              <!-- 파일 첨부 레이블 — input[type=file] 을 시각적으로 대체 -->
              <label class="file-label" for="image-input" aria-label="식재료 사진 첨부">
                ＋
              </label>
              <!-- [접근성] sr-only 가 아닌 clip 방식으로 숨김 처리 -->
              <input class="file-input" id="image-input" name="image" type="file"
                     accept="image/jpeg,image/png,image/webp">

              <!-- 메시지 입력 — Shift+Enter 줄바꿈, Enter 전송 -->
              <textarea id="message-input" name="message" maxlength="1000"
                        placeholder="예: 삶은 브로콜리를 조금 먹여도 될까요?"
                        required aria-label="메시지 입력"></textarea>

              <!-- 제출 중 disabled 처리 — ai-chat.js 의 setSending() 사용 -->
              <button class="send-button" id="send-button" type="submit">보내기</button>
            </div>
          </form>
        </article>
      </section>

      <!-- ============================================================
           AI 면책 고지
           "AI 분석 결과는 참고 정보이며 수의학적 진단이 아닙니다."
           협업가이드 주의사항 — 반드시 포함
           ============================================================ -->
      <section class="disclaimer-bar" aria-label="AI 서비스 면책 안내">
        <span aria-hidden="true">ⓘ</span>
        <div>
          <strong>AI 분석 결과는 참고 정보이며 수의학적 진단이 아닙니다.</strong><br>
          증상이 지속되거나 섭취량이 많은 경우 수의사와 상담하세요.
        </div>
      </section>
  </div>

  </main>

  <!-- [공통] 푸터 - layout.js 가 components/footer.html 을 삽입 -->
  <div id="footer-placeholder"></div>

  <!-- ============================================================
       [공통] 스크립트 - 로드 순서 고정

       layout.js   defer 없이 즉시 실행. window.TomopetAuth 정의
       api.js      defer. window.TomopetApi 정의 (TomopetAuth 의존)
       ui.js       defer. window.TomopetUi 정의
       [페이지].js  defer. 위 세 모듈을 사용

       defer 스크립트는 문서 순서대로 실행되므로
       페이지 스크립트가 실행될 때 세 모듈이 모두 준비되어 있음
       ============================================================ -->
  <script src="./scripts/layout.js"></script>
  <script src="./scripts/api.js" defer></script>
  <script src="./scripts/ui.js" defer></script>
  <!-- 페이지 전용 스크립트 -->
  <script src="./scripts/ai-chat.js" defer></script>

</body>
</html>
