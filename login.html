<!DOCTYPE html>
<!-- ============================================================
     TOMOPET | login.html
     검색 키워드: 로그인, 회원가입, 이메일 인증, 인증번호, 약관 동의
     로그인 및 회원가입 페이지
     ============================================================ -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 데스크톱 전용 - 최소 지원 폭 1024px -->
  <meta name="viewport" content="width=1024">
  <meta name="description" content="반려동물 밥 꾸미기 커뮤니티 TOMOPET">
  <title>로그인 | TOMOPET</title>

  <!-- [공통] 파비콘 - 없으면 favicon.ico 404 발생 -->
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <!-- [공통] 전역 스타일 - 로드 순서 고정 -->
  <link rel="stylesheet" href="./styles/variables.css">
  <link rel="stylesheet" href="./styles/common.css">
  <link rel="stylesheet" href="./styles/components.css">
  <!-- 페이지 전용 스타일 -->
  <link rel="stylesheet" href="./styles/login.css">
</head>
<body>

  <!-- [공통] 본문 바로가기 - 키보드 접근성 -->
  <a href="#main-content" class="skip-link">본문 바로가기</a>

  <!-- [공통] 헤더 - components/header.html 이 삽입되는 위치 -->
  <div id="header-placeholder"></div>

  <main class="site-main site-main--auth" id="main-content" role="main">
    <div class="auth-layout">

      <!-- ============================================================
           좌측 브랜딩 패널 - 랩탑 이상에서만 노출
           ============================================================ -->
      <!-- 장식이 아니라 서비스 소개 콘텐츠이므로 aria-hidden 을 걸지 않음 -->
      <aside class="auth-brand" aria-label="TOMOPET 소개">
        <div class="auth-brand__logo">
          <span class="auth-brand__logo-mark">T</span>
          <span class="auth-brand__logo-text">TOMOPET</span>
        </div>
        <p class="auth-brand__tagline">
          오늘 우리 아이<br>뭐 먹였어요?
        </p>
        <ul class="auth-brand__features">
          <li class="auth-brand__feature">직접 만든 밥상 자랑하기</li>
          <li class="auth-brand__feature">이 재료 먹여도 되는지 물어보기</li>
          <li class="auth-brand__feature">몸무게와 컨디션 기록하기</li>
          <li class="auth-brand__feature">우리 아이한테 맞는 사료 찾기</li>
        </ul>
      </aside>

      <!-- ============================================================
           우측 인증 폼 패널
           ============================================================ -->
      <section class="auth-panel" aria-labelledby="auth-title">

        <!-- 탭 전환 -->
        <div class="auth-tabs" role="tablist" aria-label="로그인 또는 회원가입">
          <button type="button" class="auth-tabs__btn auth-tabs__btn--active"
                  role="tab" id="login-tab" aria-selected="true"
                  aria-controls="login-panel" tabindex="0">
            로그인
          </button>
          <button type="button" class="auth-tabs__btn"
                  role="tab" id="signup-tab" aria-selected="false"
                  aria-controls="signup-panel" tabindex="-1">
            회원가입
          </button>
        </div>

        <!-- ============================================================
             로그인 폼
             [API 연동] POST /api/auth/login
             ============================================================ -->
        <div class="auth-tabpanel" id="login-panel" role="tabpanel" aria-labelledby="login-tab">
          <h1 class="sr-only" id="auth-title">로그인</h1>

          <form class="auth-form" id="login-form" novalidate>

            <div class="form-field">
              <label class="form-field__label" for="login-username">아이디</label>
              <input type="text" class="form-field__input" id="login-username" name="username"
                     placeholder="아이디를 입력하세요" autocomplete="username" required>
              <span class="form-field__error" id="login-username-error" role="alert" hidden></span>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="login-password">비밀번호</label>
              <input type="password" class="form-field__input" id="login-password" name="password"
                     placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
              <span class="form-field__error" id="login-password-error" role="alert" hidden></span>
            </div>

            <a href="./password-reset.html" class="auth-form__forgot">비밀번호 찾기</a>

            <!-- 서버 응답 메시지 - JS 로 내용 삽입 후 hidden 해제 -->
            <p class="auth-form__message banner banner--danger" id="login-form-message"
               role="alert" hidden></p>

            <button type="submit" class="btn btn--primary btn--full btn--lg" id="login-submit-btn">
              로그인
            </button>

          </form>

          <!-- ============================================================
               [추후 적용] 소셜 로그인
               카카오 / 구글 / 네이버 OAuth 연동 완료 후 주석 해제
               ============================================================ -->
          <!--
          <div class="auth-divider">
            <span class="auth-divider__text">또는</span>
          </div>

          <div class="social-login">

            [카카오] Redirect: /api/auth/oauth/kakao/callback
            <button type="button" class="btn btn--social btn--kakao" id="kakao-login-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-1.2 4.4c-.1.4.3.7.7.5l5.2-3.5c.2 0 .4.1.6.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/>
              </svg>
              카카오로 계속하기
            </button>

            [구글] Redirect: /api/auth/oauth/google/callback
            <button type="button" class="btn btn--social btn--google" id="google-login-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">

                <path fill="#34A853" d="M12 23c2.7 0 5-.9 6.6-2.4l-3.3-2.6c-.9.6-2 1-3.3 1-2.6 0-4.7-1.7-5.5-4H3.1v2.7A10 10 0 0 0 12 23z"/>
                <path fill="#FBBC05" d="M6.5 15c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V8.3H3.1a10 10 0 0 0 0 9l3.4-2.3z"/>
                <path fill="#EA4335" d="M12 5.4c1.5 0 2.8.5 3.8 1.5l2.9-2.9C16.9 2.4 14.7 1.5 12 1.5A10 10 0 0 0 3.1 8.3L6.5 11c.8-2.3 2.9-4 5.5-4z"/>
              </svg>
              Google로 계속하기
            </button>

            [네이버] Redirect: /api/auth/oauth/naver/callback
            <button type="button" class="btn btn--social btn--naver" id="naver-login-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M14.4 12.5 9.3 5H5v14h4.6v-7.5l5.1 7.5H19V5h-4.6v7.5z"/>
              </svg>
              네이버로 계속하기
            </button>

          </div>
          -->

        </div>

        <!-- ============================================================
             회원가입 폼
             [API 연동] POST /api/auth/signup
             ============================================================ -->
        <div class="auth-tabpanel" id="signup-panel" role="tabpanel" aria-labelledby="signup-tab" hidden>

          <form class="auth-form" id="signup-form" novalidate>

            <div class="form-field">
              <label class="form-field__label" for="signup-nickname">닉네임</label>
              <input type="text" class="form-field__input" id="signup-nickname" name="nickname"
                     placeholder="사용할 닉네임" autocomplete="nickname" maxlength="20" required>
              <span class="form-field__error" id="signup-nickname-error" role="alert" hidden></span>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="signup-username">아이디</label>
              <input type="text" class="form-field__input" id="signup-username" name="username"
                     placeholder="영문 소문자와 숫자 4~20자" autocomplete="username"
                     minlength="4" maxlength="20" required
                     aria-describedby="signup-username-hint">
              <p class="form-field__hint" id="signup-username-hint">
                로그인할 때 쓰는 아이디예요. 나중에 바꿀 수 없어요.
              </p>
              <span class="form-field__error" id="signup-username-error" role="alert" hidden></span>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="signup-email">이메일</label>
              <div class="form-field__row">
                <input type="email" class="form-field__input" id="signup-email" name="email"
                       placeholder="name@example.com" autocomplete="email" required
                       aria-describedby="signup-email-hint">
                <button type="button" class="btn btn--secondary form-field__row-btn" id="email-send-btn">
                  인증번호 발송
                </button>
              </div>
              <p class="form-field__hint" id="signup-email-hint">
                비밀번호를 잊었을 때 이 주소로 재설정 링크를 보내드려요.
              </p>
              <span class="form-field__error" id="signup-email-error" role="alert" hidden></span>
            </div>

            <!-- 인증번호 입력
                 발송 전에는 숨김 - 발송해야 의미가 생기는 필드
                 유효시간은 EMAIL_CODE_TTL_SECONDS (login.js) 로 관리
                 화면의 타이머는 안내용이고 실제 만료 판정은 서버가 함 -->
            <div class="form-field" id="email-code-field" hidden>
              <label class="form-field__label" for="signup-email-code">인증번호</label>
              <div class="form-field__row">
                <input type="text" class="form-field__input" id="signup-email-code" name="emailCode"
                       placeholder="6자리 숫자" inputmode="numeric" autocomplete="one-time-code"
                       maxlength="6">
                <span class="form-field__timer" id="email-code-timer" aria-live="polite"></span>
                <button type="button" class="btn btn--secondary form-field__row-btn" id="email-verify-btn">
                  확인
                </button>
              </div>
              <span class="form-field__error" id="signup-email-code-error" role="alert" hidden></span>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="signup-password">비밀번호</label>
              <input type="password" class="form-field__input" id="signup-password" name="password"
                     placeholder="8자 이상 입력" autocomplete="new-password" minlength="8" required>
              <span class="form-field__hint">영문, 숫자, 특수문자를 포함해 8자 이상</span>
              <span class="form-field__error" id="signup-password-error" role="alert" hidden></span>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="signup-password-confirm">비밀번호 확인</label>
              <input type="password" class="form-field__input" id="signup-password-confirm"
                     name="passwordConfirm" placeholder="비밀번호를 다시 입력하세요"
                     autocomplete="new-password" required>
              <span class="form-field__error" id="signup-password-confirm-error" role="alert" hidden></span>
            </div>

            <fieldset class="agree-group">
              <legend class="sr-only">약관 동의</legend>

              <div class="check-item">
                <input type="checkbox" class="check-item__input" id="agree-terms" name="agreeTerms" required>
                <label class="check-item__label" for="agree-terms">[필수] 이용약관 동의</label>
                <!-- 새 탭으로 열어 작성 중인 가입 정보가 사라지지 않게 함
                     rel="noopener" 는 새 탭이 window.opener 로 원본 창을 조작하지 못하게 막음 -->
                <a href="./terms.html" class="agree-group__link"
                   target="_blank" rel="noopener">보기</a>
              </div>

              <div class="check-item">
                <input type="checkbox" class="check-item__input" id="agree-privacy" name="agreePrivacy" required>
                <label class="check-item__label" for="agree-privacy">[필수] 개인정보 수집 및 이용 동의</label>
                <a href="./privacy.html" class="agree-group__link"
                   target="_blank" rel="noopener">보기</a>
              </div>

              <div class="check-item">
                <input type="checkbox" class="check-item__input" id="agree-marketing" name="agreeMarketing">
                <label class="check-item__label" for="agree-marketing">[선택] 마케팅 정보 수신 동의</label>
              </div>

            </fieldset>

            <!-- 서버 응답 메시지 - JS 로 내용 삽입 후 hidden 해제 -->
            <p class="auth-form__message banner banner--danger" id="signup-form-message"
               role="alert" hidden></p>

            <button type="submit" class="btn btn--primary btn--full btn--lg" id="signup-submit-btn">
              가입하기
            </button>

          </form>

        </div>

      </section>

    </div>
  </main>

  <!-- [공통] 푸터 - components/footer.html 이 삽입되는 위치 -->
  <div id="footer-placeholder"></div>


  <!-- ============================================================
       [공통] 스크립트 - 로드 순서 고정

       layout.js  defer 없이 즉시 실행. window.TomopetAuth 정의
       api.js     defer. window.TomopetApi 정의 (TomopetAuth 의존)
       ui.js      defer. window.TomopetUi 정의
       [페이지].js defer. 위 세 모듈을 사용

       defer 스크립트는 문서 순서대로 실행되므로
       페이지 스크립트가 실행될 때 세 모듈이 모두 준비되어 있음
       ============================================================ -->
  <script src="./scripts/layout.js"></script>
  <script src="./scripts/api.js" defer></script>
  <script src="./scripts/ui.js" defer></script>

  <!-- 페이지 전용 스크립트 -->
  <script src="./scripts/login.js" defer></script>

</body>
</html>
